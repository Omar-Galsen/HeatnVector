<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Three energy terms in Bernoulli's equation</title>
<desc id="desc">Pressure pushes water through a pipe, water speed represents kinetic energy, and raising the outlet represents gravitational potential energy. All terms are energy per unit volume.</desc>
<defs><linearGradient id="water" x2="1" y2="0"><stop stop-color="#2692b3"/><stop offset="1" stop-color="#65c9bd"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f4d776"/></marker></defs>
<rect x="2" y="2" width="956" height="386" rx="22" fill="#0b2837" stroke="#426775" stroke-width="3"/>
<text x="34" y="39" fill="#f3fbf8" font-family="system-ui,sans-serif" font-size="24" font-weight="750">Where does the fluid's energy go?</text>
<text x="34" y="65" fill="#bbd7d8" font-family="system-ui,sans-serif" font-size="15">Each term is energy per unit volume (J/m³ = Pa).</text>
<g font-family="system-ui,sans-serif">
<rect x="24" y="86" width="288" height="275" rx="15" fill="#143847" stroke="#3c6570"/>
<text x="42" y="118" fill="#a8ebd5" font-size="21" font-weight="700">P · Pressure</text>
<text x="42" y="142" fill="#d4e8e6" font-size="14">Pushing work on the water</text>
<path d="M55 206 H268 V258 H55Z" fill="url(#water)" stroke="#7bd9d0" stroke-width="2"/>
<path d="M79 192 V271" stroke="#f3fbf8" stroke-width="7"/>
<path d="M107 232 H203" stroke="#f4d776" stroke-width="6" marker-end="url(#arrow)"/>
<text x="42" y="302" fill="#e7f9f4" font-size="16">Pressure force moves the fluid</text>
<text x="42" y="327" fill="#b4d3d3" font-size="14">higher P → more pushing work</text>
<rect x="336" y="86" width="288" height="275" rx="15" fill="#143847" stroke="#3c6570"/>
<text x="354" y="118" fill="#a8ebd5" font-size="21" font-weight="700">½ρv² · Motion</text>
<text x="354" y="142" fill="#d4e8e6" font-size="14">Kinetic energy of flowing water</text>
<path d="M360 205 H478 L545 218 H598 V246 H545 L478 259 H360Z" fill="url(#water)" stroke="#7bd9d0" stroke-width="2"/>
<path d="M383 232 H449 M463 232 H516 M535 232 H574" stroke="#f4d776" stroke-width="4" marker-end="url(#arrow)"/>
<text x="354" y="302" fill="#e7f9f4" font-size="16">Smaller area → faster flow</text>
<text x="354" y="327" fill="#b4d3d3" font-size="14">higher v → larger ½ρv²</text>
<rect x="648" y="86" width="288" height="275" rx="15" fill="#143847" stroke="#3c6570"/>
<text x="666" y="118" fill="#a8ebd5" font-size="21" font-weight="700">ρgz · Height</text>
<text x="666" y="142" fill="#d4e8e6" font-size="14">Gravitational potential energy</text>
<path d="M673 260 H738 L822 195 H909 V228 H834 L750 293 H673Z" fill="url(#water)" stroke="#7bd9d0" stroke-width="2"/>
<path d="M779 276 V203" stroke="#f4d776" stroke-width="5" marker-end="url(#arrow)"/>
<text x="666" y="302" fill="#e7f9f4" font-size="16">Water gains elevation</text>
<text x="666" y="327" fill="#b4d3d3" font-size="14">higher z → larger ρgz</text>
</g>
</svg>